version: '3.8'

services:
  mimi:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mimi-dev
    ports:
      - "8765:8765"
      - "5173:5173"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - WEBSOCKET_HOST=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/web_avatar/node_modules
      - /app/.venv
    working_dir: /app
    command: /app/docker/entrypoint.sh
    stdin_open: true
    tty: true
